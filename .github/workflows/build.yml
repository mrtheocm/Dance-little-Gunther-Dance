name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for simulator (verificação de compilação)
        run: |
          xcodebuild -project GuntherDance.xcodeproj -target GuntherDance -configuration Debug \
            -sdk iphonesimulator ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Build unsigned .ipa (para instalar via AltStore/Sideloadly)
        run: |
          xcodebuild -project GuntherDance.xcodeproj -target GuntherDance -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/out" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R out/Release-iphoneos/GuntherDance.app Payload/
          zip -qr GuntherDance-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GuntherDance-unsigned-ipa
          path: GuntherDance-unsigned.ipa
