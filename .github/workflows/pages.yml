name: Publicar versão web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar o detector de batida
        run: node web/test/beat-test.js
      - name: Testar a análise de músicas inteiras
        run: node web/test/track-test.js
      - name: Testar links de YouTube e SoundCloud
        run: node web/test/links-test.js
      - name: Testar traduções
        run: node web/test/i18n-test.js
      - name: Testar pés batendo no chão no kick
        run: node web/test/sync-test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
